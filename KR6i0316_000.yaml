front:
  text: 金光明經照解敘書肆來曰請點此書余開而見之則石芝曉公金光明疏也門分十段悉解經文至第九段設三十六問答雖但解光明義實通諸經余不耐踊躍三餘之暇正烏焉誤加倭訓而刊行石芝所撰四明教行録樂文類施食通覽等曩既行于世今亦此書出於戲曉公為人之意其不泯者也歟時元祿八乙亥臘月初吉總之下州高妙雲山法輪講寺住學之僧如海謹志
